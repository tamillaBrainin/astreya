services:
  backend:
    build:
      context: ../astrologyAnalyzer/astrologyAnylizer
      dockerfile: Dockerfile
    image: astreya-backend:latest
    container_name: astreya-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    ports:
      - "8082:8082"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "/api"
    image: astreya-web:latest
    container_name: astreya-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"
